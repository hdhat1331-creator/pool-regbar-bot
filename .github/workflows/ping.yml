name: Keep Pool Bot Awake

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: |
          curl -s -o /dev/null -w "%{http_code}\n" https://pool-regbar-bot.onrender.com/
          echo "Ping sent at $(date)"
